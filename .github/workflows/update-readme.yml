name: Update README Stats

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README with latest stats
        run: |
          sed -i '/^Last updated:/d' README.md
          # Trim any trailing blank lines left behind before re-adding the marker
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' README.md
          echo "" >> README.md
          echo "Last updated: $(date -u)" >> README.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update README stats"
          file_pattern: README.md
